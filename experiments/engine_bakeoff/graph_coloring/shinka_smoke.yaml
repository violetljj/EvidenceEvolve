max_evaluation_jobs: 1
max_proposal_jobs: 1
max_db_workers: 1
verbose: false

evo_config:
  task_sys_msg: >-
    Improve a deterministic graph-coloring solver. The candidate must always
    return a valid coloring for every supplied graph and repeated calls with
    identical inputs must return identical results. Minimize the number of
    distinct colors; combined_score is the mean relative improvement over the
    frozen degree-ordered greedy baseline. Modify only the EVOLVE block.
  llm_models:
    - "headless/codex@gpt-5.6-sol?effort=high"
  llm_dynamic_selection: null
  llm_kwargs:
    temperatures: [0.0]
    max_tokens: 32768
  patch_types: [full]
  patch_type_probs: [1.0]
  max_patch_resamples: 1
  max_patch_attempts: 1
  max_novelty_attempts: 1
  max_api_costs: null
  embedding_model: null
  novelty_llm_models: null
  meta_rec_interval: null
  evolve_prompts: false
  proposal_target_mode: fixed

db_config:
  num_islands: 1
  archive_size: 4
  num_archive_inspirations: 1
  num_top_k_inspirations: 1
  migration_rate: 0.0
  enforce_island_separation: true

job_config:
  time: "00:10:00"

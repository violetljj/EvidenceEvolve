schema_version: "1.0"
campaign:
  id: algotune_set_cover_blind_v0_template
  base_commit: HEAD
  research_question: Can bounded search produce a valid faster AlgoTune set-cover solver on fixed development inputs?
  claim_scope: algotune_set_cover_blind_pilot_only
authority:
  protocol_mutable: false
  evaluator_mutable: false
  confirmation_visible_to_agents: false
  final_merge_requires_human: true
editable_scope:
  allow:
    - tasks/algotune_set_cover/initial.py
  deny:
    - evidence_evolve/**
    - tasks/algotune_set_cover/common.py
    - tasks/algotune_set_cover/evaluator.py
    - tasks/algotune_set_cover/campaign_evaluator.py
    - tasks/algotune_set_cover/autonomous_adapter.py
    - tasks/algotune_set_cover/headless_logged.py
    - benchmarks/**
    - prompts/**
    - research/**
    - confirmation/**
evidence_sources:
  - source_id: algotune-set-cover-dev-b-v0
    grade: B
    path: research/evidence_policies/algotune_set_cover_dev_manifest.json
    permissions: [DEV]
frozen_assets:
  - {asset_id: algotune-common-v0, kind: evaluator, path: tasks/algotune_set_cover/common.py}
  - {asset_id: algotune-evaluator-v0, kind: evaluator, path: tasks/algotune_set_cover/evaluator.py}
  - {asset_id: algotune-campaign-evaluator-v0, kind: evaluator, path: tasks/algotune_set_cover/campaign_evaluator.py}
  - {asset_id: algotune-autonomous-adapter-v0, kind: adapter, path: tasks/algotune_set_cover/autonomous_adapter.py}
  - {asset_id: harness-models-v0, kind: harness_core, path: evidence_evolve/models.py}
  - {asset_id: harness-archive-v0, kind: harness_core, path: evidence_evolve/archive.py}
  - {asset_id: harness-research-memory-v0, kind: harness_core, path: evidence_evolve/research_memory.py}
  - {asset_id: harness-artifacts-v0, kind: harness_core, path: evidence_evolve/artifacts.py}
  - {asset_id: harness-budgets-v0, kind: harness_core, path: evidence_evolve/budgets.py}
  - {asset_id: harness-campaign-runner-v0, kind: harness_core, path: evidence_evolve/discovery/campaign.py}
  - {asset_id: harness-population-v0, kind: harness_core, path: evidence_evolve/discovery/population.py}
  - {asset_id: harness-autonomous-v0, kind: harness_core, path: evidence_evolve/discovery/autonomous.py}
  - {asset_id: harness-director-v0, kind: harness_core, path: evidence_evolve/discovery/director.py}
  - {asset_id: harness-policy-v0, kind: harness_core, path: evidence_evolve/meta_evolution/policy.py}
  - {asset_id: harness-codex-v0, kind: harness_core, path: evidence_evolve/backends/codex_cli.py}
  - {asset_id: harness-hashing-v0, kind: harness_core, path: evidence_evolve/hashing.py}
  - {asset_id: harness-replay-v0, kind: harness_core, path: evidence_evolve/replay.py}
  - {asset_id: harness-worktrees-v0, kind: harness_core, path: evidence_evolve/worktrees.py}
  - {asset_id: harness-candidate-auditor-v0, kind: harness_core, path: evidence_evolve/governance/candidate_auditor.py}
  - {asset_id: harness-gate-v0, kind: harness_core, path: evidence_evolve/governance/gate_engine.py}
  - {asset_id: harness-protocol-lock-v0, kind: harness_core, path: evidence_evolve/governance/protocol_lock.py}
  - {asset_id: harness-evidence-policy-v0, kind: harness_core, path: evidence_evolve/governance/evidence_policy.py}
  - {asset_id: harness-closure-v0, kind: harness_core, path: evidence_evolve/governance/closure_registry.py}
  - {asset_id: harness-scope-v0, kind: harness_core, path: evidence_evolve/governance/scope.py}
  - {asset_id: explorer-prompt-v0, kind: protocol, path: prompts/explorer.md}
  - {asset_id: implementer-prompt-v0, kind: protocol, path: prompts/implementer.md}
  - {asset_id: closure-registry-v0, kind: protocol, path: research/closures/closure_registry.yaml}
  - {asset_id: algotune-confirmation-v0, kind: confirmation, path: confirmation/algotune_set_cover_external_manifest.json}
metrics:
  hard_constraints:
    invalid_solution_rate: {max: 0.0}
  pareto_objectives:
    raw_speedup: maximize
required_controls: [candidate_valid, development_only]
budgets:
  proposal_calls: 3
  implementations: 3
  mechanics_runs: 3
  proxy_runs: 0
  confirmation_runs: 0
  device_runs: 0
  literature_searches: 0
  repository_inspections: 0
  replications: 0
  evidence_acquisitions: 0
closure_registry: research/closures/closure_registry.yaml

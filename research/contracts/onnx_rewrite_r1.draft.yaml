    kind: confirmation
    path: confirmation/onnx_rewrite_hidden_manifest.json
metrics:
  hard_constraints:
    checker_failure:
      max: 0.0
    max_abs_error:
      max: 0.00001
    output_shape_mismatch:
      max: 0.0
  pareto_objectives:
    node_count: minimize
    model_bytes: minimize
    latency_ms: minimize
budgets:
  proposal_calls: 4
  implementations: 3
  mechanics_runs: 3
  proxy_runs: 0
  confirmation_runs: 0
  device_runs: 0
closure_registry: research/closures/closure_registry.yaml

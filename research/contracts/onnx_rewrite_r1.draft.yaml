schema_version: "1.0"
campaign:
  id: onnx_rewrite_r1
  base_commit: HEAD
  research_question: Can a bounded two-generation Codex loop discover ONNX rewrite improvements while preserving exact task behavior?
  claim_scope: autonomous_engineering_harness_canary_only
authority:
  protocol_mutable: false
  evaluator_mutable: false
  confirmation_visible_to_agents: false
  final_merge_requires_human: true
editable_scope:
  allow:
    - tasks/onnx_rewrite/candidates/candidate.py
  deny:
    - evidence_evolve/**
    - tasks/onnx_rewrite/evaluator.py
    - tasks/onnx_rewrite/model_factory.py
    - tasks/onnx_rewrite/autonomous_adapter.py
    - prompts/**
    - research/**
    - confirmation/**
evidence_sources:
  - source_id: onnx-rewrite-dev-b-r1
    grade: B
    path: research/evidence_policies/onnx_rewrite_dev_manifest.json
    permissions: [DEV, CONFIRM, CLAIM]
frozen_assets:
  - asset_id: onnx-rewrite-evaluator-r1
    kind: evaluator
    path: tasks/onnx_rewrite/evaluator.py
  - asset_id: onnx-rewrite-autonomous-adapter-r1
    kind: adapter
    path: tasks/onnx_rewrite/autonomous_adapter.py
  - asset_id: onnx-rewrite-observation-builder-r1
    kind: adapter
    path: evidence_evolve/onnx_campaign.py
  - asset_id: onnx-rewrite-model-factory-r1
    kind: model
    path: tasks/onnx_rewrite/model_factory.py
  - asset_id: harness-models-r1
    kind: harness_core
    path: evidence_evolve/models.py
  - asset_id: harness-archive-r1
    kind: harness_core
    path: evidence_evolve/archive.py
  - asset_id: harness-artifacts-r1
    kind: harness_core
    path: evidence_evolve/artifacts.py
  - asset_id: harness-budgets-r1
    kind: harness_core
    path: evidence_evolve/budgets.py
  - asset_id: harness-campaign-runner-r1
    kind: harness_core
    path: evidence_evolve/discovery/campaign.py
  - asset_id: harness-autonomous-runner-r1
    kind: harness_core
    path: evidence_evolve/discovery/autonomous.py
  - asset_id: harness-codex-backend-r1
    kind: harness_core
    path: evidence_evolve/backends/codex_cli.py
  - asset_id: harness-hashing-r1
    kind: harness_core
    path: evidence_evolve/hashing.py
  - asset_id: harness-replay-r1
    kind: harness_core
    path: evidence_evolve/replay.py
  - asset_id: harness-worktrees-r1
    kind: harness_core
    path: evidence_evolve/worktrees.py
  - asset_id: harness-candidate-auditor-r1
    kind: harness_core
    path: evidence_evolve/governance/candidate_auditor.py
  - asset_id: harness-gate-engine-r1
    kind: harness_core
    path: evidence_evolve/governance/gate_engine.py
  - asset_id: harness-protocol-lock-r1
    kind: harness_core
    path: evidence_evolve/governance/protocol_lock.py
  - asset_id: harness-evidence-policy-r1
    kind: harness_core
    path: evidence_evolve/governance/evidence_policy.py
  - asset_id: harness-closure-r1

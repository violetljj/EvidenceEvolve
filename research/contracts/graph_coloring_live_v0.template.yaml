schema_version: "1.0"
campaign:
  id: graph_coloring_live_v0_template
  base_commit: HEAD
  research_question: Can bounded code search reduce valid graph-color counts on the frozen public development instances?
  claim_scope: public_graph_coloring_benchmark_pilot_only
authority:
  protocol_mutable: false
  evaluator_mutable: false
  confirmation_visible_to_agents: false
  final_merge_requires_human: true
editable_scope:
  allow:
    - tasks/graph_coloring/candidates/baseline.py
  deny:
    - evidence_evolve/**
    - tasks/graph_coloring/evaluator.py
    - tasks/graph_coloring/campaign_evaluator.py
    - tasks/graph_coloring/autonomous_adapter.py
    - benchmarks/**
    - prompts/**
    - research/**
    - confirmation/**
evidence_sources:
  - source_id: graph-coloring-public-dev-b-v0
    grade: B
    path: research/evidence_policies/graph_coloring_dev_manifest.json
    permissions: [DEV]
frozen_assets:
  - asset_id: graph-coloring-campaign-evaluator-v0
    kind: evaluator
    path: tasks/graph_coloring/campaign_evaluator.py
  - asset_id: graph-coloring-autonomous-adapter-v0
    kind: adapter
    path: tasks/graph_coloring/autonomous_adapter.py
  - asset_id: graph-coloring-shared-evaluator-v0
    kind: evaluator
    path: tasks/graph_coloring/evaluator.py
  - asset_id: graph-coloring-instance-manifest-v0
    kind: model
    path: benchmarks/graph_coloring/instances_v0.json
  - asset_id: harness-models-v0
    kind: harness_core
    path: evidence_evolve/models.py
  - asset_id: harness-archive-v0
    kind: harness_core
    path: evidence_evolve/archive.py
  - asset_id: harness-research-memory-v0
    kind: harness_core
    path: evidence_evolve/research_memory.py
  - asset_id: harness-artifacts-v0
    kind: harness_core
    path: evidence_evolve/artifacts.py
  - asset_id: harness-budgets-v0
    kind: harness_core
    path: evidence_evolve/budgets.py
  - asset_id: harness-campaign-runner-v0
    kind: harness_core
    path: evidence_evolve/discovery/campaign.py

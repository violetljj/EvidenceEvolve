    path: evidence_evolve/research_actions/models.py
  - asset_id: harness-research-action-store-v0
    kind: harness_core
    path: evidence_evolve/research_actions/store.py
  - asset_id: harness-literature-intelligence-v0
    kind: harness_core
    path: evidence_evolve/research_actions/intelligence.py
  - asset_id: harness-research-policy-v0
    kind: harness_core
    path: evidence_evolve/meta_evolution/policy.py
  - asset_id: harness-codex-backend-v0
    kind: harness_core
    path: evidence_evolve/backends/codex_cli.py
  - asset_id: harness-hashing-v0
    kind: harness_core
    path: evidence_evolve/hashing.py
  - asset_id: harness-replay-v0
    kind: harness_core
    path: evidence_evolve/replay.py
  - asset_id: harness-worktrees-v0

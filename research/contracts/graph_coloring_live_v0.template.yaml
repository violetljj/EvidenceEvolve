metrics:
  hard_constraints:
    invalid_coloring_rate:
      max: 0.0
    nonreproducible_rate:
      max: 0.0
  pareto_objectives:
    mean_color_count: minimize
    relative_improvement: maximize
required_controls:
  - coloring_valid
  - deterministic_solver
  - development_only_evaluation
budgets:
  proposal_calls: 2
  implementations: 2
  mechanics_runs: 2
  proxy_runs: 0
  confirmation_runs: 0
  device_runs: 0
  literature_searches: 0
  repository_inspections: 0
  replications: 0
  evidence_acquisitions: 0
closure_registry: research/closures/closure_registry.yaml

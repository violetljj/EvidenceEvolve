schema_version: "1.0"
policy_id: algotune_set_cover_m2_r4_structural_basin_wave_v0
parent_selector: island_stratified
context_compiler: lineage_plus_failure_signature
stagnation_response: cross_family_structural_restart
stagnation_generations: 1
stagnation_reset: incumbent_refresh
incumbent_metric: raw_speedup
incumbent_min_delta: 0.1
parent_quality_guardrail_fraction: 0.0
escape_budget_generations: 8
force_seed_restart_roots: false
prefer_distinct_root_context: true
structural_operator: failure_directed_mechanism_substitution
failure_window: 16
require_non_seed_parent: true
require_cross_lineage_context: false
operator_plan_calls_per_escape: 1
moonshot_fraction: 0.0
island_ids: [main]
island_capacity: 32
parents_per_island: 4
migration_interval: 8
migration_count: 0
stepping_stone_min_information_gain: 0.5
max_parallel_proposals: 8
max_parallel_evaluations: 4
literature_papers_per_action: 0
repositories_per_action: 0
source_files_per_repository: 0
code_parent_dispositions: [CODE_PARENT, FAILURE_DIRECTED_SEED]
mutation_operator_mix:
  mechanism_mutation: 1.0
breakthrough_mutation_mix:
  cross_family: 0.5
  failure_directed_mutation: 0.5
weights:
  admit_probability: 1.0
  expected_improvement: 1.0
  information_gain: 1.0
  novelty: 1.0
  transfer_value: 0.25
  cost: 0.75
  redundancy: 1.0

# R3C is closed for budget allocation only. This does not reinterpret its
# development evaluations as a scientific outcome or claim basin exhaustion.
closed_basin_id: pivot_branch_and_bound
closure_interpretation: PIVOT_BNB_LOCAL_REFINEMENT_NOT_SUPPORTED
closure_source: runs/algotune_set_cover_m2_r3c_dev_v1/result.json
conversion_threshold: 47.801
probe_min_speedup: 45.0
candidate_slots: 8
maximum_signature_jaccard: 0.6
required_profile_metrics:
  - wall_time_ns
  - wall_time_p50_ns
  - wall_time_p95_ns
  - wall_time_p99_ns
  - node_expansions
  - bound_time_ns
  - cache_time_ns
  - reduction_ratio
prohibited_source_markers:
  - kernel_search
  - pivot_sets
  - choose_pivot
  - propagate_forced_pivots
  - inherited_solver
prohibited_claim_terms: [pivot, residual_incidence_branching]

basins:
  - basin_id: primal_dual_guided
    mechanism_signature: [PRIMAL_DUAL, DUAL_GUIDANCE, EXACT_RESIDUAL]
    directive: Use primal-dual or dual-ascent signals to construct/prune an exact solver; do not branch on residual-incidence pivots.
  - basin_id: lagrangian_exact_repair
    mechanism_signature: [LAGRANGIAN_RELAXATION, EXACT_REPAIR]
    directive: Solve a Lagrangian relaxation and perform a provably exact residual correction; no pivot-B&B fallback is permitted.
  - basin_id: reduction_primal_dual_exact
    mechanism_signature: [KERNELIZATION, DOMINANCE_REDUCTION, PRIMAL_HEURISTIC, DUAL_BOUND, EXACT_RESIDUAL]
    directive: Build the integrated reduction -> strong primal -> dual/lower-bound -> exact residual pipeline.
  - basin_id: meet_in_middle_decomposition
    mechanism_signature: [MEET_IN_THE_MIDDLE, DECOMPOSITION]
    directive: Change the search topology through variable or universe decomposition and meet-in-the-middle combination.
  - basin_id: lower_bound_redesign
    mechanism_signature: [LOWER_BOUND_REDESIGN, EXACT_RESIDUAL]
    directive: Implement a genuinely new admissible lower-bound family and an exact residual solver; moving the existing coverage bound is forbidden.
  - basin_id: heuristic_then_exact
    mechanism_signature: [PRIMAL_HEURISTIC, INCUMBENT_DRIVEN_PRUNING, EXACT_RESIDUAL]
    directive: Construct a strong feasible incumbent first, then use it to drive an exact non-pivot residual algorithm.
  - basin_id: online_branch_value
    mechanism_signature: [ONLINE_BRANCH_SCORING, STATISTICAL_BRANCH_VALUE, EXACT_RESIDUAL]
    directive: Use online/statistical branch-value estimates over non-pivot decisions with exact termination; fixed pivot rules are forbidden.
  - basin_id: state_equivalence_redesign
    mechanism_signature: [STATE_EQUIVALENCE, MEMO_REDESIGN, EXACT_RESIDUAL]
    directive: Redesign state equivalence classes and cache granularity as part of a new exact residual topology; memo-skip tuning alone is forbidden.

schema_version: "1.0"
policy_id: r1_default
parent_selector: island_stratified
context_compiler: lineage_plus_failure_signature
stagnation_response: cross_family_structural_restart
stagnation_generations: 3
moonshot_fraction: 0.1
island_ids:
  - main
island_capacity: 32
parents_per_island: 4
migration_interval: 3
migration_count: 1
stepping_stone_min_information_gain: 0.6
max_parallel_proposals: 1
max_parallel_evaluations: 1
literature_papers_per_action: 5
repositories_per_action: 2
source_files_per_repository: 3
code_parent_dispositions:
  - CODE_PARENT
  - FAILURE_DIRECTED_SEED
mutation_operator_mix:
  mechanism_mutation: 0.4
  representation_mutation: 0.3
  failure_directed_mutation: 0.3
breakthrough_mutation_mix:
  representation_mutation: 0.4
  cross_family: 0.35
  restart: 0.25
weights:
  admit_probability: 1.0
  expected_improvement: 1.0
  information_gain: 1.0
  novelty: 0.5
  transfer_value: 0.25
  cost: 0.5
  redundancy: 0.5

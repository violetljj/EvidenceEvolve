[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evidence-evolve"
version = "0.1.0"
description = "Evidence-gated, reproducible algorithm discovery harness"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "EvidenceEvolve contributors" }]
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pytest-xdist>=3.6,<4",
]
shinka = [
  "shinka-evolve @ git+https://github.com/SakanaAI/ShinkaEvolve.git@c4568adde253cacf185be3a8412c3c2142761ebe",
]
onnx-canary = [
  "numpy>=2.0,<3",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
]
algotune-portfolio = [
  "networkx>=3.4,<4",
  "numpy>=2.0,<3",
  "ortools>=9.11,<9.12",
  "scipy>=1.14,<2",
]

[project.scripts]
evolve = "evidence_evolve.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["evidence_evolve"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
